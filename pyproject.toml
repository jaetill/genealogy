[project]
name = "genealogy"
version = "0.1.0"
description = "Genealogy research automation â€” GEDCOM processing + FamilySearch API + MCP server"
authors = [
    { email = "tilley_jason@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ged4py>=0.5.2",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "SIM102", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
