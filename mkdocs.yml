site_name: genealogy
site_url: https://jaetill.github.io/genealogy/
repo_url: https://github.com/jaetill/genealogy
edit_uri: edit/main/docs/

theme:
  name: material
  features: [content.code.copy, navigation.tabs, navigation.sections, search.highlight]

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Architecture:
    - Overview: architecture/overview.md
  - ADRs:
    - Index: adr/index.md
    - "ADR-0001 Platform adoption": adr/0001-platform-adoption.md
  - Runbooks:
    - Index: runbooks/index.md
    - "Run MCP server": runbooks/run-mcp.md